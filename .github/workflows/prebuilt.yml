# Builds the libraries this repository compiles itself (the GLFW shim and KSA Metal) and publishes them
# as a release named after their sources' stamp, which scripts/fetch-prebuilt.sh downloads. Players then need
# neither the Command Line Tools nor Homebrew. The release carries a build provenance attestation:
#   gh attestation verify ksa-macos-natives-<stamp>.tar.gz --repo <owner>/ksa-macos-port
name: Prebuilt natives

on:
  push:
    branches: [main]
    paths: [scripts/**, src/**]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    # The driver needs the macOS 26 SDK (Xcode 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        id: package
        run: |
          tag="$(scripts/package-prebuilt.sh out | tail -1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.package.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest build provenance
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*.tar.gz

      - name: Publish
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.package.outputs.tag }}" out/* \
            --title "Prebuilt natives ${{ steps.package.outputs.tag }}" \
            --notes "The GLFW shim and KSA Metal built from ${GITHUB_SHA}. Downloaded by port.sh and update.sh when they match the sources."
