# Mac settings for Kitten Space Agency (ksa-macos-port)
#
# The game reads these when it starts: quit it and start it again after a change. A line you delete takes its
# default (the value written here). Delete the file to get this one back. Messages about the file go to
# logs/console.log in this folder.

# render_scale: the 3D view's size, as a fraction of the window's, from 0.5 to 1.0. Below 1.0 the view is drawn
# smaller and scaled back up, which saves GPU time and changes the image a little (1.0: full size).
render_scale = 1.0

# upscaler: how a smaller view is scaled back up. "metalfx": Apple's MetalFX, using the last frames (sharpest);
# "spatial": MetalFX one frame at a time; "none": stretched.
upscaler = "metalfx"

# retina: show the image at the display's full resolution, scaled up from the window's size with MetalFX. The game
# itself still draws at the window's size.
retina = false

# frame_interpolation: show a frame made by MetalFX between every two the game draws: smoother motion, a little more
# delay. Works best when the game runs at least at half the display's refresh rate.
frame_interpolation = false

# cloud_shadows: "slow" saves about 1.5 ms per frame over Earth; cloud shadows then take about 4 times longer to follow
# moving clouds. "normal" is the game's own.
cloud_shadows = "normal"
